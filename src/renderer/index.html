<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenPDR Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>body{background:#1a1a1a}.hud-element{display:none}</style>
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header id="toolbar">
      <button id="btn-hamburger" title="Menu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button id="btn-open" title="Open PDR file">Open File</button>
      <span id="file-name">No file loaded</span>
      <select id="lap-selector" title="Select lap" style="display:none">
        <option value="full">Full Recording</option>
      </select>
      <select id="compare-lap-a" class="compare-select compare-a" title="Lap A" style="display:none"></select>
      <div class="toolbar-spacer"></div>
      <div id="toolbar-center">
        <button id="btn-edit" title="Edit overlay layout (E)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button id="btn-gear" title="Settings & tools"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="btn-update" title="Update available" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      </div>
      <button id="btn-edit-mobile" class="mobile-only-btn">Layout Edit Mode</button>
      <span id="fps-counter" title="Render FPS"></span>
      <select id="compare-lap-b" class="compare-select compare-b" title="Lap B" style="display:none"></select>
      <button id="btn-compare" title="Compare laps" style="display:none">Compare</button>
    </header>

    <!-- Unified gear panel dropdown (hidden by default) -->
    <div id="gear-panel"></div>

    <!-- Main content: video + chart panel with resize handle -->
    <div id="main-content">
      <!-- Video + overlay container -->
      <div id="video-container">
        <video id="video" preload="auto" playsinline webkit-playsinline></video>

        <!-- Toast shown when video decoder is lost (e.g. mobile sleep) -->
        <div id="video-recovery-toast" class="hidden">
          Playback interrupted by device - tap to reload
        </div>

        <!-- HUD overlays — positioned inside anchor that matches video bounds -->
        <div id="video-overlay-anchor">
        <div class="hud-element" id="hud-speed" data-overlay="speed">
          <span id="hud-speed-value">--</span>
          <span id="hud-speed-unit">MPH</span>
        </div>
        <div class="hud-element" id="hud-rpm-gauge" data-overlay="rpmGauge">
        </div>
        <div class="hud-element" id="hud-rpm-bar" data-overlay="rpmBar">
        </div>
        <div class="hud-element" id="hud-gear" data-overlay="gear">
          <span id="hud-gear-value">-</span>
          <span id="hud-shift-arrow" class="shift-arrow"></span>
        </div>
        <div class="hud-element" id="hud-steering" data-overlay="steering">
          <svg id="steering-svg" class="steering-svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <path d="M370.513 874.855c-48.815-20.02-92.685-50.082-129.215-87.716-69.276-71.384-112.122-170.011-112.122-278.945 0-108.918 42.846-207.544 112.122-278.929 69.836-71.953 170.267-107.93 270.706-107.93 100.423 0 200.861 35.977 270.688 107.93 69.276 71.384 112.131 170.01 112.131 278.929 0 108.934-42.855 207.561-112.131 278.945-36.52 37.633-80.399 67.694-129.205 87.716-45.187 18.524-93.334 27.811-141.483 27.811-48.166 0-96.298-9.288-141.491-27.811l0 0zM512.005 199.998c-80.213 0-160.425 28.732-216.19 86.211-33.202 34.203-58.802 76.253-73.97 123.216-4.189 15.772 1.398 23.218 16.742 22.364 50.317-1.991 158.745-3.58 181.017-4.735-19.13 22.356-30.724 51.706-30.724 83.843 0 35.031 13.779 66.757 36.06 89.716 7.949 8.2 16.994 15.277 26.875 20.983 18.62 10.778 39.397 16.165 60.19 16.174 20.785-0.008 41.563-5.396 60.181-16.174 9.881-5.707 18.919-12.783 26.875-20.983 22.281-22.959 36.06-54.684 36.06-89.716 0-32.136-11.603-61.488-30.716-83.843 22.263 1.155 130.691 2.744 181.001 4.735 15.345 0.853 20.94-6.593 16.742-22.364-15.159-46.962-40.762-89.012-73.971-123.216-55.764-57.48-135.968-86.211-216.174-86.211l0 0zM581.084 439.837c-35.645-36.729-102.534-36.729-138.178 0-17.676 18.215-28.613 43.389-28.613 71.185 0 27.811 10.937 52.978 28.613 71.199 6.813 7.011 14.615 13.002 23.19 17.704 28.483 15.645 63.324 15.645 91.808 0 8.566-4.702 16.377-10.694 23.182-17.704 17.684-18.222 28.62-43.389 28.62-71.199 0.001-27.794-10.936-52.969-28.62-71.185l0 0zM529.738 548.203c13.365-6.761 22.564-20.933 22.564-37.307 0-17.353-10.337-32.221-25.008-38.428-9.71-4.108-20.875-4.108-30.586 0-14.672 6.208-25.008 21.076-25.008 38.428 0 16.373 9.191 30.546 22.555 37.307 11.074 5.588 24.423 5.588 35.483 0l0 0zM575.449 817.192c58.964-12.818 111.669-43.147 152.728-85.459 42.896-44.2 73.092-101.47 84.509-165.509 4.109-17.369-3.143-22.69-15.848-22.272-25.626-0.56-51.261-0.452-75.691 4.293-87.041 16.909-118.171 60.19-133.574 159.829-5.595 36.193-9.151 78.547-12.123 109.118l0 0zM448.541 817.192c-2.963-30.572-6.528-72.925-12.114-109.118-15.404-99.638-46.54-142.919-133.583-159.829-24.423-4.745-50.065-4.853-75.691-4.293-12.699-0.418-19.957 4.902-15.841 22.272 11.408 64.039 41.614 121.309 84.501 165.509 41.068 42.312 93.764 72.64 152.728 85.459z"/>
            <rect class="steering-notch" x="500" y="118" width="24" height="80" rx="5"/>
          </svg>
          <span id="steering-label" class="steering-label"></span>
        </div>
        <div class="hud-element" id="hud-gforce" data-overlay="gforce">
          <svg id="gforce-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="52" fill="rgba(0,0,0,0.4)"/>
            <circle cx="60" cy="60" r="17.33" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <circle cx="60" cy="60" r="34.67" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <line x1="8" y1="60" x2="112" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <line x1="60" y1="8" x2="60" y2="112" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <circle class="gforce-dot" cx="60" cy="60" r="5" fill="#ff6b00" stroke="#fff" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="hud-element" id="hud-pedals" data-overlay="pedals">
          <div class="pedal-bar">
            <div id="throttle-fill" class="pedal-fill throttle"></div>
            <span class="pedal-label">THR</span>
          </div>
          <div class="pedal-bar">
            <div id="brake-fill" class="pedal-fill brake"></div>
            <span class="pedal-label">BRK</span>
          </div>
        </div>
        <div class="hud-element" id="hud-gps" data-overlay="gps">
          <span id="hud-gps-lat">--</span>
          <span id="hud-gps-lon">--</span>
          <span id="hud-gps-alt">--</span>
        </div>
        <div class="hud-element" id="hud-trackMap" data-overlay="trackMap">
          <canvas id="track-canvas"></canvas>
        </div>
        <div class="hud-element" id="hud-session" data-overlay="session">
          <div id="hud-session-content"></div>
        </div>
        </div><!-- /video-overlay-anchor -->

        <!-- No-file prompt -->
        <div id="no-file-prompt">
          <img id="logo" src="./logo.svg" alt="OpenPDR" draggable="false" />
        </div>

        <!-- Parse progress overlay -->
        <div id="parse-progress"></div>
      </div>

      <!-- Resize handle between video and chart panel -->
      <div id="resize-handle"></div>

      <!-- Strip chart panel -->
      <div id="chart-panel">
        <div id="chart-tabs">
          <button class="panel-toggle active" data-panel="charts">Charts</button>
          <button class="panel-toggle" data-panel="laps">Laps</button>
          <div id="chart-toolbar"></div>
        </div>
        <div id="chart-content-row">
          <div id="charts-panel" class="active">
            <div id="chart-canvas-container">
              <canvas id="chart-canvas"></canvas>
              <div id="chart-empty">Open a file to view data</div>
            </div>
          </div>
          <div id="laps-resize-handle" class="panel-resize-handle"></div>
          <div id="laps-panel">
            <div id="lap-table-container"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Transport controls + scrub bar -->
    <div id="controls">
      <button id="btn-play" title="Play/Pause">&#9654;</button>
      <button id="btn-loop" title="Loop zoom region"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <span id="time-current">0:00.0</span>
      <div id="scrub-container">
        <div id="scrub-track">
          <div id="scrub-zoom-region">
            <div id="scrub-zoom-left" class="scrub-zoom-handle"></div>
            <div id="scrub-zoom-right" class="scrub-zoom-handle"></div>
          </div>
          <div id="scrub-progress"></div>
          <div id="scrub-thumb"></div>
        </div>
      </div>
      <span id="time-total">0:00.0</span>
      <select id="playback-rate" title="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <!-- Update modal -->
    <div id="update-modal" class="modal-backdrop" style="display:none">
      <div class="modal-content">
        <h3 id="update-modal-title"></h3>
        <div id="update-modal-changelog"></div>
        <div id="update-modal-actions"></div>
      </div>
    </div>
  </div>

  <!-- Debug panel -->
  <div id="debug-panel"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
